services:
  - type: web
    name: sst-backend-uat
    runtime: python
    plan: free
    region: oregon
    autoDeployTrigger: commit
    buildCommand: pip install -r requirements.txt
    startCommand: sh -c 'attempt=1; until alembic upgrade head; do if [ "$attempt" -ge 5 ]; then exit 1; fi; echo "Database not ready, retrying migrations in 5s..."; attempt=$((attempt + 1)); sleep 5; done; uvicorn app.main:app --host 0.0.0.0 --port $PORT'
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: uat
      - key: APP_NAME
        value: SST Backend UAT
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DISABLE_2FA
        value: "true"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_USE_TLS
        sync: false
      - key: SMTP_USE_SSL
        sync: false
      - key: SMTP_TIMEOUT_SECONDS
        value: "15"
      - key: FRONTEND_URLS
        value: http://localhost:3000,http://127.0.0.1:3000
      - key: LOCAL_ORIGIN_REGEX
        value: https?://(localhost|127\.0\.0\.1)(:\d+)?$
      - key: STORAGE_PROVIDER
        value: supabase_s3
      - key: SUPABASE_PROJECT_ID
        value: ugvbjpnaehuxptvuwsvl
      - key: SUPABASE_STORAGE_BUCKET
        value: sst-storage
      - key: SUPABASE_S3_ENDPOINT
        value: https://ugvbjpnaehuxptvuwsvl.supabase.co/storage/v1/s3
      - key: SUPABASE_S3_DIRECT_HOST
        value: https://ugvbjpnaehuxptvuwsvl.storage.supabase.co/storage/v1/s3
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: MAX_IMAGE_UPLOAD_MB
        value: "5"
      - key: MAX_DOCUMENT_UPLOAD_MB
        value: "20"
      - key: MAX_VIDEO_UPLOAD_MB
        value: "200"
